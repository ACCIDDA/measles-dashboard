# Dedicated, lightweight CI for the R data producers (#55).
#
# Kept SEPARATE from the main JS CI (ci.yml) so the R toolchain is installed only
# when the producer scripts actually change. Triggered solely on pull requests
# that touch scripts/build-data/**. Runs the testthat suite over the extracted,
# fit-independent helpers (point-in-polygon county assignment, county-name
# title-casing, coverage-gap detection, and the wide #20 schema column order)
# with tiny synthetic fixtures - never the 484 MB CA stanfit.
name: Producer Tests

on:
  pull_request:
    paths:
      - 'scripts/build-data/**'

concurrency:
  group: producer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testthat:
    name: R producer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only the deps the extracted helpers + suite need. The geometry and string
      # helpers are base R; data.table backs the schema helpers and the producer
      # scripts. sf and imuGAP are NOT needed: the NC producer rolls its own
      # ray-casting PIP, and the tested logic is fit-independent.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::testthat

      - name: Run testthat suite
        run: Rscript scripts/build-data/tests/testthat.R
