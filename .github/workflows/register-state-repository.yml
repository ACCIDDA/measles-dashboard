name: Register State Repository

on:
  workflow_dispatch:
    inputs:
      state_code:
        description: Official two-letter USPS state code (for example, NC)
        required: true
        type: string
      repository_url:
        description: HTTPS URL of the state GitHub repository
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: register-state-${{ inputs.state_code }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate source and prepare registration
        id: validate
        env:
          STATE_CODE: ${{ inputs.state_code }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/register-state-repository.mjs > registration.json
      - name: Create registration branch and commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_CODE: ${{ inputs.state_code }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          set -euo pipefail
          branch="register-${STATE_CODE,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('registration.json')); fs.writeFileSync(r.registryPath, r.registry)"
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('registration.json')); fs.writeFileSync(r.manifestPath, r.manifest)"
          git config user.name "ACCIDA registration bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stateRegistry.json public/data/states.json
          git commit -m "Register ${STATE_CODE^^} state repository"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open registration pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_CODE: ${{ inputs.state_code }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('registration.json'));
          const state = process.env.STATE_CODE.toUpperCase();
          const result = r.result;
          const body = [
            `## ${state} repository registration`,
            '',
            `- **Repository:** ${r.repository.html_url}`,
            `- **State:** ${state}`,
            `- **GitHub repository ID:** ${r.repository.id}`,
            `- **Dataset location:** \`${r.dataset.root || '.'}\``,
            `- **Source commit SHA:** \`${r.sourceCommitSha}\``,
            `- **Rows:** ${result.rowCounts.states} state, ${result.rowCounts.counties} county, ${result.rowCounts.schools} school`,
            `- **Base URL:** ${r.baseUrl}`,
            '',
            '### Automated validation',
            '- Repository URL is a canonical HTTPS GitHub URL.',
            '- Repository metadata and immutable repository ID were retrieved.',
            '- All required ACCIDA CSV files and headers were found.',
            '- Schema, value, state identity, county linkage, and coverage checks passed.',
            '',
            '> An administrator must review and merge this PR. It is not automatically merged.',
          ].join('\n');
          const { execFileSync } = require('child_process');
          execFileSync('gh', ['pr', 'create', '--base', 'dev', '--head', `register-${process.env.STATE_CODE.toLowerCase()}-${process.env.GITHUB_RUN_ID}`, '--title', `Register ${state} state repository`, '--body', body], { stdio: 'inherit' });
          NODE
